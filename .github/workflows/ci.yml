name: ci

# dev (task PRs) runs on Linux only and nothing waits on it; main (release PRs) runs both systems.
on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.base_ref == 'dev' || github.ref == 'refs/heads/dev') && '["ubuntu-latest"]' || '["ubuntu-latest", "macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # Pinned: a linter built with an older Go refuses to read the module.
          version: v2.15.0
          # make check runs the linter itself; the action only installs it.
          install-only: true
      - run: make check
